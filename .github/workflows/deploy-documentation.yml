name: Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'documentation_main/**'
      - 'documentation_clients/**'
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch:  # Déclenchement manuel

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour le merge des branches
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install openai
        sudo apt-get update && sudo apt-get install -y jq
    
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
    
    - name: Step 1 - Translate documentation
      run: |
        echo "🌍 Step 1: Translating documentation..."
        export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        python scripts/translate.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    - name: Check if translations were modified
      id: check-translations
      run: |
        if git diff --quiet HEAD -- locale/; then
          echo "modified=false" >> $GITHUB_OUTPUT
          echo "📝 No translation changes detected"
        else
          echo "modified=true" >> $GITHUB_OUTPUT
          echo "📝 Translation changes detected"
        fi
    
    - name: Step 2 - Commit translations to main
      if: steps.check-translations.outputs.modified == 'true'
      run: |
        echo "💾 Step 2: Committing translations to main..."
        git add locale/
        git commit -m "Auto-translate: Update translations [skip ci]"
        git push origin main
    
    - name: Detect affected clients
      if: steps.check-translations.outputs.modified == 'true'
      id: detect-clients
      run: |
        echo "🔍 Detecting affected clients..."
        
        # Charger la configuration des clients depuis JSON
        CLIENTS_JSON=$(cat scripts/clients.json)
        CLIENTS_CSV=$(echo "$CLIENTS_JSON" | jq -r '.clients | keys | join(",")')
        
        # Détecter les changements dans documentation_main (affecte tous les clients)
        if git diff --name-only HEAD~1 HEAD | grep -q "^documentation_main/"; then
          echo "📚 Changes detected in documentation_main - all clients affected"
          echo "affected_clients=$CLIENTS_CSV" >> $GITHUB_OUTPUT
        else
          # Détecter les changements spécifiques par client
          affected_clients=""
          
          for client in $(echo "$CLIENTS_JSON" | jq -r '.clients | keys[]'); do
            if git diff --name-only HEAD~1 HEAD | grep -q "^documentation_clients/${client}/"; then
              affected_clients="$affected_clients,${client}"
            fi
          done
          
          # Supprimer la virgule en début si elle existe
          affected_clients=$(echo "$affected_clients" | sed 's/^,//')
          
          if [ -z "$affected_clients" ]; then
            echo "ℹ️ No client-specific changes detected"
            echo "affected_clients=" >> $GITHUB_OUTPUT
          else
            echo "🎯 Affected clients: $affected_clients"
            echo "affected_clients=$affected_clients" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Step 3 - Merge to affected client branches
      if: steps.check-translations.outputs.modified == 'true' && steps.detect-clients.outputs.affected_clients != ''
      run: |
        echo "🔄 Step 3: Merging to affected client branches..."
        
        # Convertir la liste en array
        IFS=',' read -ra CLIENTS <<< "${{ steps.detect-clients.outputs.affected_clients }}"
        
        for client in "${CLIENTS[@]}"; do
          echo "🔄 Processing client: $client"
          
          # Vérifier si la branche existe
          if git show-ref --verify --quiet "refs/remotes/origin/${client}"; then
            echo "📋 Checkout de la branche '${client}'..."
            if git checkout "${client}"; then
              echo "✅ Checkout réussi de '${client}'"
              
              # Merge avec main
              echo "🔄 Merge de 'main' dans '${client}'..."
              if git merge main; then
                echo "✅ Merge réussi de 'main' dans '${client}'"
                
                # Push de la branche après merge réussi
                echo "📤 Push de la branche '${client}'..."
                if git push origin "${client}"; then
                  echo "✅ Push réussi de '${client}'"
                else
                  echo "❌ Échec du push de '${client}'"
                fi
              else
                echo "❌ Échec du merge de 'main' dans '${client}'"
              fi
            else
              echo "❌ Échec du checkout de '${client}'"
            fi
          else
            echo "⚠️ La branche '${client}' n'existe pas, passage à la suivante"
          fi
          
          echo "---"
        done
        
        # Retourner à la branche main
        echo "🔄 Retour à la branche main"
        git checkout main
    
    - name: Step 4 - Summary
      run: |
        echo "✅ Step 4: Deployment completed!"
        echo "📚 ReadTheDocs will automatically detect changes and rebuild documentation"
        
        if [ "${{ steps.check-translations.outputs.modified }}" == "true" ]; then
          echo "📝 Translations were updated and deployed"
          
          if [ "${{ steps.detect-clients.outputs.affected_clients }}" != "" ]; then
            echo "🌐 Updated client branches: ${{ steps.detect-clients.outputs.affected_clients }}"
          else
            echo "ℹ️ No client branches needed updating"
          fi
        else
          echo "📝 No translation changes - deployment skipped"
        fi
